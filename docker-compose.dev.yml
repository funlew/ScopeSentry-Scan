# ScopeSentry-Scan 本地开发编排（扫描端）
# 中间件与服务端由 ../ScopeSentry 的 docker-compose.dev.yml 提供，两者共用
# 固定名网络 scopesentry-dev。
#
# 启动顺序：
#   1) cd ../ScopeSentry && docker compose -f docker-compose.dev.yml up -d --build
#   2) docker compose -f docker-compose.dev.yml up --build
# 文档：docs/LOCAL-DEV.md
# 项目名保持 scopesentry-dev，便于复用已有卷（go-mod / go-build 是编译缓存）
name: scopesentry-dev

networks:
  scopesentry-dev:
    external: true
    name: scopesentry-dev

services:
  scan:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    init: true
    # air 接管进程，崩溃后不自动拉起，方便看 panic 现场
    restart: "no"
    stop_grace_period: 10s
    environment:
      NodeName: ${NodeName:-local-docker-dev}
      TimeZoneName: Asia/Shanghai
      DEBUG: "true"
      MONGODB_IP: mongodb
      MONGODB_PORT: "27017"
      MONGODB_DATABASE: ScopeSentry
      MONGODB_USER: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGODB_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mongodb_password}
      REDIS_IP: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    networks:
      - scopesentry-dev
    ports:
      - "6060:6060"   # pprof（DEBUG=true 时开启）
      - "2346:2345"   # delve（服务端占用了宿主的 2345）
    volumes:
      - .:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - scan-config:/apps/config
      - scan-data:/apps/data
      - scan-dictionaries:/apps/dictionaries
      - scan-ext:/apps/ext
      - scan-poc:/apps/poc
      - scan-plugin:/apps/plugin
      - scan-tmp:/apps/tmp

volumes:
  go-mod:
  go-build:
  scan-config:
  scan-data:
  scan-dictionaries:
  scan-ext:
  scan-poc:
  scan-plugin:
  scan-tmp:
